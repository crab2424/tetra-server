name: Deploy to server

on:
  push:
    branches: [main]
  # Actionsタブから手動実行もできるようにする
  workflow_dispatch:

# 連続pushした場合は最後のデプロイだけ走らせる
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # 接続先は Oracle Cloud（Ubuntu）．Secrets 名は EC2 時代のまま（EC2_HOST = サーバーの公開IP）．
      # 先に最新の main を取得してから deploy.sh を実行する（実行中のスクリプト自身を
      # git reset で書き換えないため）．bash -l で ~/.profile を読み，cargo を PATH に入れる．
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@"${{ secrets.EC2_HOST }}" \
            'cd ~/tetra-server && git fetch origin main && git reset --hard origin/main && bash -l deploy/deploy.sh'
